
name: Build arulSU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          if [ ! -f "arulSU-github-build.zip" ]; then
            echo "File ZIP proyek tidak ditemukan!"
            ls -la
            exit 1
          fi

      - name: Extract Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p source
          unzip -q arulSU-github-build.zip -d source

          echo "Isi proyek:"
          find source -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build arulSU APK
        run: |
          WRAPPER="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "gradlew tidak ditemukan di dalam ZIP."
            echo "Periksa apakah ZIP berisi source proyek Android."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/artifacts/apk"

          find . -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/apk/" \;

          if ! ls "$GITHUB_WORKSPACE"/artifacts/apk/*.apk >/dev/null 2>&1; then
            echo "Build selesai, tetapi APK tidak ditemukan."
            exit 1
          fi

      - name: Upload arulSU APK
        uses: actions/upload-artifact@v4
        with:
          name: arulSU-APK
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 7
