name: Build arulSU APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
  - name: Install Android build tools
    run: |
      yes | sdkmanager --licenses
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
  - name: Find original APK
    id: source
    shell: bash
    run: |
      APK=$(find . -maxdepth 2 -type f -iname '*.apk' \
        ! -path './output/*' | head -n 1)
      if [ -z "$APK" ]; then
        echo "APK sumber tidak ditemukan di repositori."
        exit 1
      fi
      echo "apk=$APK" >> "$GITHUB_OUTPUT"
      echo "APK sumber: $APK"
  - name: Download Apktool
    run: |
      python3 - <<'PY'
      import json
      import urllib.request
      url = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"
      req = urllib.request.Request(
          url, headers={"User-Agent": "GitHub-Actions"}
      )
      with urllib.request.urlopen(req) as response:
          release = json.load(response)
      assets = [
          a for a in release["assets"]
          if a["name"].endswith(".jar")
          and a["name"].startswith("apktool_")
          and "small" not in a["name"]
      ]
      if not assets:
          raise SystemExit("File JAR Apktool tidak ditemukan.")
      asset = assets[0]
      req = urllib.request.Request(
          asset["browser_download_url"],
          headers={"User-Agent": "GitHub-Actions"}
      )
      with urllib.request.urlopen(req) as response:
          data = response.read()
      with open("apktool.jar", "wb") as f:
          f.write(data)
      PY
  - name: Decode original APK
    run: |
      java -jar apktool.jar d \
        "${{ steps.source.outputs.apk }}" \
        -f -o decoded
  - name: Change visible app label
    run: |
      python3 - <<'PY'
      from pathlib import Path
      root = Path("decoded/res")
      count = 0
      for p in root.rglob("*.xml"):
          try:
              text = p.read_text(encoding="utf-8")
          except (UnicodeDecodeError, OSError):
              continue
          updated = text.replace("BakaSU", "arulSU")
          if updated != text:
              p.write_text(updated, encoding="utf-8")
              count += 1
      print(f"File resource yang diperbarui: {count}")
      PY
  - name: Build unsigned APK
    run: |
      java -jar apktool.jar b decoded -o unsigned.apk
  - name: Create signing key
    run: |
      keytool -genkeypair \
        -keystore signing-key.jks \
        -storepass android \
        -keypass android \
        -alias arulsu \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=arulSU, OU=Build, O=Local, L=Unknown, ST=Unknown, C=ID"
  - name: Align and sign APK
    run: |
      mkdir -p output
      zipalign -f -p 4 unsigned.apk aligned.apk
      apksigner sign \
        --ks signing-key.jks \
        --ks-pass pass:android \
        --key-pass pass:android \
        --out output/arulSU.apk \
        aligned.apk
      apksigner verify --verbose output/arulSU.apk
  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: arulSU-APK
      path: output/arulSU.apk
      if-no-files-found: error
