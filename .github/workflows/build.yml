
name: Build arulSU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check and Extract Project
        run: |
          mkdir -p source

          if [ -f "gradlew" ]; then
            echo "Gradle Wrapper ditemukan di folder utama."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

          elif [ -f "arulSU-github-build.zip" ]; then
            echo "Mengekstrak ZIP proyek..."
            unzip -q arulSU-github-build.zip -d source

            WRAPPER="$(find source -type f -name gradlew -print -quit)"

            if [ -z "$WRAPPER" ]; then
              echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
              echo "Periksa apakah ZIP berisi source code proyek Android."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          else
            echo "ERROR: Gradle Wrapper dan ZIP proyek tidak ditemukan."
            ls -la
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Build arulSU APK
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts/apk

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp -v {} artifacts/apk/ \;

          if ! find artifacts/apk -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          echo "APK berhasil ditemukan:"
          ls -lh artifacts/apk/

      - name: Upload arulSU APK
        uses: actions/upload-artifact@v4
        with:
          name: arulSU-APK
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 7
