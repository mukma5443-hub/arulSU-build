name: Build arulSU APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
      - name: Check source APK
        run: |
          APK=$(find . -maxdepth 3 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: File APK asli tidak ditemukan."
            exit 1
          fi
          echo "APK ditemukan: $APK"
