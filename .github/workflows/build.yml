
name: Build arulSU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

      - name: Find source APK
        run: |
          APK="$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Tidak ada file APK di folder utama."
            exit 1
          fi
          echo "SOURCE_APK=$APK" >> "$GITHUB_ENV"
          echo "APK ditemukan: $APK"

      - name: Decode APK
        run: |
          java -jar apktool.jar d "$SOURCE_APK" \
            -o decoded-apk --force

      - name: Rename BakaSU text
        run: |
          find decoded-apk -type f \
            \( -name '*.xml' -o -name '*.smali' -o -name '*.txt' \) \
            -exec sed -i 's/BakaSU/arulSU/g' {} +

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decoded-apk \
            -o unsigned.apk

      - name: Align APK
        run: |
          zipalign -f -p 4 unsigned.apk aligned.apk

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair \
            -keystore release.jks \
            -storepass android \
            -keypass android \
            -alias arulsu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=arulSU"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out arulSU.apk \
            aligned.apk
          apksigner verify arulSU.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arulSU-apk
          path: arulSU.apk
          if-no-files-found: error
